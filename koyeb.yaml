# Koyeb deployment configuration
# This file contains deployment settings for Koyeb platform

# Build configuration
BUILD_COMMAND: npm run build
START_COMMAND: npm start

# Environment variables
NODE_ENV: production
PORT: 3000
HOST: 0.0.0.0

# Health check
HEALTH_CHECK_PATH: /
HEALTH_CHECK_INTERVAL: 30s
HEALTH_CHECK_TIMEOUT: 10s

# Resource limits (Koyeb free tier)
MEMORY_LIMIT: 512MB
CPU_LIMIT: 0.1

# Auto-scaling
MIN_INSTANCES: 0
MAX_INSTANCES: 1

# Custom domain
DOMAIN: oussematrabelsi.com
SSL_ENABLED: true
